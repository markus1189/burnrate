name: "Flake Update"
on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

# The repository default for GITHUB_TOKEN is read-only; pushing the updated
# lock file back needs this explicitly.
permissions:
  contents: write

jobs:
  upgrades:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: configure git
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
    # If the build fails after the update the step fails, the commit step is
    # skipped, and the old lock file stays. A broken bump is never pushed.
    - name: perform flake update
      run: |
        nix flake update
        nix build
    - name: commit and push
      run: |
        git add .
        git commit -m "Flake Update" && git push origin || echo "nothing to do"
